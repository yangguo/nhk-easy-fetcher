name: Source contract

on:
  workflow_dispatch:
    inputs:
      live:
        description: Run live structural probe against NHK (requires repo secrets/vars)
        type: boolean
        default: false
  # Low-frequency optional schedule — structural sitemap check only, no content artifacts.
  schedule:
    - cron: "0 6 1 * *"

jobs:
  offline-contract:
    if: github.event_name != 'workflow_dispatch' || inputs.live != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Offline probe
        run: nhk-easy probe --json
      - name: Contract summary tests
        run: pytest -q tests/test_contract_summary.py

  live-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Live structural probe (no content saved)
        env:
          NHK_EASY_LIVE_TEST: "1"
        run: |
          nhk-easy probe --live --i-understand-live-requests --json
      - name: Contract summary tests
        run: pytest -q tests/test_contract_summary.py
